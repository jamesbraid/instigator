# instigator configuration. Addresses here are RFC 5737 documentation
# ranges. Replace them with your own.

# The server's own address on the client's segment, advertised in BOOTP
# replies as the address the PROM tftps from.
server_ip: 192.0.2.10

# Offered to the client in the BOOTP reply's vendor area.
netmask: 192.0.2.0/24

# BOOTP answers only these MACs. Read the MAC from the PROM with
# `printenv eaddr`. Everything else on the segment is ignored, so the
# LAN's real DHCP server is untouched.
clients:
  - name: octane
    mac: "08:00:69:0e:af:12"
    ip: 192.0.2.30

# HTTP Basic auth for private https:// sources, matched by host. A
# ${VAR} password is expanded from the environment at config load. A
# literal password is used as-is.
# credentials:
#   - host: media.example.com
#     username: instigator
#     password: ${FORGEJO_TOKEN}

# Where fetched archives and extracted trees are cached across runs.
# Defaults to the user cache dir (/var/cache/instigator in a minimal
# container with no HOME).
# cache_dir: /var/cache/instigator

# Each install set is one served IRIX distribution tree, assembled by
# layering ordered sources on top of each other. A layer's "source" is
# a local path (an SGI image or an extracted directory) or an
# http(s):// URL - instigator auto-detects image vs. directory. No
# disc name ever appears in the served path - a set's layers merge
# into one tree at /<name>. Every configured set is always built and
# browsable. "enabled" defaults to true. The second set below shows
# the option. It controls only whether a set is offered in the
# generated admin-source command file. See docs/install.md for the
# operator guide.
install_sets:
  # The base release, and the one set the PROM boots. Every layer
  # contributes its distribution directory to this set's single dist;
  # "dist" is the default, so ordinary media name nothing. boot: true
  # additionally serves that layer's stand/ at /6.5.30/stand, which is
  # where the PROM fetches fx.64 - at most one layer per set may set it,
  # and a set nobody netboots needs none at all.
  - name: "6.5.30"
    layers:
      - name: overlays1
        source: /media/6.5.30/overlays1.image
        boot: true
      - name: overlays2
        source: /media/6.5.30/overlays2.image
        dist: dist
      - name: overlays3
        source: /media/6.5.30/overlays3.image
        dist: dist

  # A second set, opened after the first at the Inst> prompt. Its
  # second layer is a version-stub disc whose real distribution
  # directory is dist6.5 - rebased here onto this set's logical dist,
  # so inst never sees the "dist6.5" name. Both layers ship an
  # inst.README with different text at the same served path,
  # foundations/dist/inst.README. collisions names the layer whose
  # copy wins. Any other file that differs at the same path with no
  # entry here fails the build instead of guessing - only exact,
  # reviewed overrides get to pick a winner.
  - name: foundations
    layers:
      - name: foundation1
        source: /media/foundations/foundation1.image
      - name: foundation2
        source: /media/foundations/foundation2.image
        dist: dist
      - name: onc3-nfs
        source: /media/foundations/onc3-nfs.image
        dist: dist6.5
    collisions:
      foundations/dist/inst.README: foundation1
    # enabled: false   # still built and browsable, just not opened

  # Development Foundation/Libraries are part of the base IRIX media set,
  # not the deferred MIPSpro compiler family. Keep this set before the
  # application sets: this is the order proven on the Octane.
  - name: development
    layers:
      - name: devlibs
        source: /media/foundations/devlibs.image
        dist: dist
      - name: devfoundation
        source: /media/foundations/devfoundation.image
        dist: dist/dist6.5

  # Applications and Complementary Applications are separate sets. They
  # must remain separate even though both are part of the base profile.
  - name: applications
    layers:
      - name: applications
        source: /media/6.5.30/applications.image

  - name: complementary
    layers:
      - name: complementary
        source: /media/6.5.30/complementary-applications.image

  # Optional freeware media are opened last in the proven base profile.
  # This one is fetched over HTTPS instead of read from local disk: the
  # tarball unpacks to disc1/dist/..., so base points at disc1. sha256
  # is checked against the downloaded file before it's unpacked, and
  # the extracted tree is kept under cache_dir so a repeat run skips
  # the fetch.
  - name: freeware
    layers:
      - name: freeware
        source: https://media.example.com/irix/freeware-february-2003.tar.gz
        base: disc1
        sha256: ce4145e1e72c42b371e030480f7e2a15fd6355db2ab642e523741e8deaedcfc0

services:
  bootp: true
  tftp:
    # SGI PROMs ignore tftp transfers from high source ports. Keep the
    # transfer sockets low.
    port_range: [2048, 32767]
  rsh: true
