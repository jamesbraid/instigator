name: release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    # Only github.com can publish these releases; the guard skips other forges.
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    steps:
      - name: check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: set up go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: run goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
