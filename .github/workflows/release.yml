name: release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    # Only github.com can publish these releases; the guard skips other forges.
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    steps:
      - name: check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: extract release notes
        env:
          TAG: ${{ github.ref_name }}
          # Outside the checkout: goreleaser refuses a dirty working tree.
          NOTES: ${{ runner.temp }}/notes.md
        run: |
          set -eu
          version=${TAG#v}
          # The section under "## <version> - <date>", up to the next "## ".
          awk -v v="$version" 'index($0, "## " v " - ") == 1 {on=1; next} /^## / {on=0} on' CHANGELOG.md > "$NOTES"
          if ! grep -q '[^[:space:]]' "$NOTES"; then
            echo "CHANGELOG.md has no ## $version section" >&2
            exit 1
          fi
      - name: set up go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: run goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean --release-notes=${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
