format = 1
base_url = "https://origami-dist.irix.fans/irix/"
sets = ["6.5.30", "foundations", "development", "applications", "complementary"]
[package_selections.minimal]
sets = ["6.5.30", "foundations"]
install = ["nfs.sw.nfs"]
# The standard selection picks these, but their prerequisites are not on
# the minimal profile's discs. The overlay discs carry only 6.5.30 updates of
# MediaWarehouse and WebViewer, and inst will not install an update whose
# original product, on the Applications disc, is absent.
keep = [
    # Needs media_warehouse.sw.viewers from the Applications disc.
    "desktop_base.sw.dso6_2",
    # Needs webviewer.sw.eoe from the Applications disc.
    "insight.sw.sgihelp",
    # Inventor SDK: needs the Development Foundation and Libraries discs.
    "inventor_dev",
]

[package_selections.standard]
sets = ["6.5.30", "foundations", "development", "applications", "complementary"]
install = ["nfs.sw.nfs"]
keep = ["inventor_dev", "java2_plugin.sw32.mozilla_freeware", "java_dev.sw32.binaries"]

# Add-ons install after IRIX in a second pass. path is relative to base_url
# and to a --media-root.

# The MIPSpro 7.4.4 archive holds the whole compiler distribution and its
# 7.4.2m and 7.4.4m overlays. The separate MIPSpro C archive repeats the
# same c_fe product byte for byte, so it is not needed.
[addons.mipspro]
path = "mipspro/7.4.4/mipspro744update.tar.gz"
base = "MIPSPro7.4.4"
dist = "."
# The standard profile installs older C, C++ and Fortran compilers
# from the Development Foundation disc. inst refuses to upgrade
# compiler_dev under the old C++ and Fortran compilers, so the
# add-on upgrades every compiler product in the archive, as its
# instructions do with inst's Upgrade keyword.
install = [
    "c++_dev",
    "c++_fe",
    "c_dev",
    "c_fe",
    "compiler_dev",
    "ftn77_dev",
    "ftn77_fe",
    "ftn90_dev",
    "ftn90_fe",
    "ftn_dev",
    "langtools",
    "modules",
]

# The RAD4 driver archive and selection the user guide gives. Public archive
# only; there is no local copy.
[addons.rad4]
path = "addons/rad4/rad4x_65_13k.tar.gz"
local = false
dist = "dist_6.5"
install = ["rad4x.sw.driver", "rad4x.sw.xserver", "rad4x.man"]

